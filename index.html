<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2a6b">
<title>Tafel-Octopus voor Tom 🐙</title>
<style>
:root{--navy:#1b2a6b;--sea:#2b3f9e;--cream:#fff8e7;--ink:#14204f;--yellow:#ffd23f;--green:#2ecc8f;--red:#ff6b6b;
--c5:#ff9f43;--c6:#ff6b9d;--c7:#a55eea;--c8:#1dd1a1;--c9:#54a0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:var(--ink);
background:radial-gradient(circle at 20% 10%,#3f56c9 0,transparent 40%),radial-gradient(circle at 90% 90%,#223a99 0,transparent 45%),var(--navy);
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
.bubble{position:fixed;border-radius:50%;border:3px solid #ffffff33;pointer-events:none;animation:up linear infinite}
@keyframes up{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
main{max-width:720px;margin:0 auto;padding:16px 16px 32px;position:relative}
h1{color:var(--cream);font-size:clamp(34px,7vw,52px);margin:4px 0;line-height:1;text-align:center}
.sub{color:#cfd8ff;text-align:center;margin:0 0 14px;font-size:18px}
.mascot{font-size:84px;text-align:center;animation:bob 3s ease-in-out infinite;line-height:1}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.panel{background:var(--cream);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:16px;margin:16px 0}
.panel h2{margin:0 0 10px;font-size:20px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{border:4px solid var(--ink);border-radius:20px;padding:10px 0 8px;text-align:center;background:#fff;opacity:.55;cursor:pointer;
box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.chip.on{opacity:1;background:var(--col)}
.chip b{display:block;font-size:34px;color:var(--ink)}
.chip small{display:block;margin:4px 8px 0;height:8px;border-radius:5px;background:#0003;overflow:hidden}
.chip small i{display:block;height:100%;background:var(--ink)}
.modes{display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;font-size:20px;color:var(--ink);background:#fff;
border:4px solid var(--ink);border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.mode span{font-size:40px}.mode small{display:block;font-weight:700;font-size:15px;opacity:.7}
.mode:active,.chip:active,.opt:active,.key:active,.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.stars{color:var(--yellow);text-align:center;font-size:20px;margin-top:6px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.x,.snd{font:inherit;font-size:22px;width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);background:var(--cream);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.bar{flex:1;height:22px;border-radius:12px;border:4px solid var(--ink);background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.streak{color:var(--yellow);font-size:22px;min-width:60px;text-align:right}
.card{background:var(--col,#fff);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:18px 14px;text-align:center}
.q{font-size:clamp(54px,14vw,96px);line-height:1.1;color:var(--ink)}
.seq{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.seq span{min-width:62px;padding:10px 8px;background:#fff;border:4px solid var(--ink);border-radius:16px;font-size:34px}
.seq .gap{background:var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.opt,.key,.btn{font:inherit;color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.opt{font-size:46px;padding:18px 0}
.opt.good,.key.good{background:var(--green)}.opt.bad{background:var(--red)}
.display{margin:14px auto 0;max-width:260px;height:80px;background:#fff;border:4px solid var(--ink);border-radius:20px;font-size:54px;line-height:72px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:16px auto 0}
.key{font-size:34px;padding:12px 0}.key.go{background:var(--green)}
.btn{font-size:24px;padding:14px 26px;background:var(--yellow);margin:8px 6px}
.fb{min-height:72px;text-align:center;margin-top:14px;color:var(--cream);font-size:26px}
.fb .sum{font-size:34px;color:var(--yellow)}
.hint{display:block;margin:10px auto 0;font:inherit;font-size:18px;background:none;border:0;color:#cfd8ff;text-decoration:underline;cursor:pointer;padding:8px}
.result{text-align:center;color:var(--cream)}
.result .big{font-size:96px;letter-spacing:6px}.result p{font-size:24px;margin:8px 0}
.hide{display:none}
.fall{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:9;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const COL={5:'#ff9f43',6:'#ff6b9d',7:'#a55eea',8:'#1dd1a1',9:'#54a0ff'};
const MODES={kies:['🎯','Kies het antwoord','Tik op het goede getal'],typ:['🔢','Typ het antwoord','Met de grote toetsen'],reeks:['🚂','Vul de reeks aan','Welk getal ontbreekt?']};
const PRAISE=['Goed zo!','Super!','Top!','Wauw!','Geweldig!','Lekker bezig!','Knap hoor!'];
let save={},sel=new Set([5,6,7,8,9]),sound=true,G=null,audio;
try{save=JSON.parse(localStorage.getItem('tafelOctopus'))||{}}catch(e){}
const store=()=>{try{localStorage.setItem('tafelOctopus',JSON.stringify(save))}catch(e){}};
const rnd=n=>Math.floor(Math.random()*n), shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

function beep(notes){ if(!sound)return; try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)();
 notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;
 const t=audio.currentTime+i*.12;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
 o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.25)})}catch(e){} }
function confetti(n=30){ const e=['⭐','🎉','✨','🐙','💙','🌟']; for(let i=0;i<n;i++){const s=document.createElement('span');s.className='fall';
 s.textContent=e[rnd(e.length)];s.style.left=rnd(100)+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)} }
function bubbles(){ if(document.querySelector('.bubble'))return; for(let i=0;i<9;i++){const b=document.createElement('div');b.className='bubble';
 const s=16+rnd(46);b.style.cssText=`width:${s}px;height:${s}px;left:${rnd(96)}vw;animation-duration:${14+rnd(16)}s;animation-delay:-${rnd(20)}s`;document.body.appendChild(b)} }

const prog=t=>{let s=0;for(let n=1;n<=10;n++)s+=Math.min(save[t+'x'+n]||0,2);return s/20};
const totalStars=()=>Object.values(save).reduce((a,v)=>a+Math.min(v,2),0);

function home(){ G=null;
 app.innerHTML=`<div class="mascot">🐙</div><h1>Tafel-Octopus voor Tom</h1><p class="sub">Oefen de tafels en verdien sterren!</p>
 <div class="panel"><h2>Welke tafels wil je oefenen Tom?</h2><div class="chips">${[5,6,7,8,9].map(t=>
 `<div class="chip ${sel.has(t)?'on':''}" style="--col:${COL[t]}" data-t="${t}" role="button" tabindex="0"><b>${t}</b><small><i style="width:${prog(t)*100}%"></i></small></div>`).join('')}</div></div>
 <div class="modes">${Object.entries(MODES).map(([k,[i,n,d]])=>`<button class="mode" data-m="${k}"><span>${i}</span><div>${n}<small>${d}</small></div></button>`).join('')}</div>
 <div class="stars">⭐ ${totalStars()} sterren verzameld</div>
 <p class="sub" style="margin-top:14px"><button class="snd" id="snd">${sound?'🔊':'🔇'}</button></p>`;
 app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const t=+c.dataset.t;sel.has(t)?(sel.size>1&&sel.delete(t)):sel.add(t);home()});
 app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
 $('#snd').onclick=()=>{sound=!sound;home()};
}

function build(){ const f=[]; sel.forEach(t=>{for(let n=1;n<=10;n++)f.push({t,n,w:(save[t+'x'+n]||0)+Math.random()*2.5})});
 return shuffle(f.sort((a,b)=>a.w-b.w).slice(0,10)); }
function start(mode){ G={mode,qs:build(),i:0,score:0,streak:0,locked:false,typed:''}; bubbles(); ask(); }

function options(ans,t,n){ const c=new Set([ans]); const cand=[ans+t,ans-t,ans+1,ans-1,ans+10,ans-10,t*(n+2),t*(n-2),ans+2,ans-2];
 shuffle(cand).forEach(v=>{if(c.size<4&&v>0&&v!==ans)c.add(v)}); return shuffle([...c]); }

function ask(){ const q=G.qs[G.i],{t,n}=q; G.locked=false; G.typed='';
 const pct=Math.round(G.i/G.qs.length*100);
 let body='';
 if(G.mode==='reeks'){ const s=Math.max(1,Math.min(n-2,6)); const items=[];
  for(let k=s;k<s+5;k++)items.push(k===n?`<span class="gap">?</span>`:`<span>${t*k}</span>`);
  body=`<div class="sub" style="color:var(--ink);margin-bottom:10px">Tafel van ${t}</div><div class="seq">${items.join('')}</div>`; }
 else body=`<div class="q">${t} × ${n}</div>`;
 const useOpts=G.mode!=='typ';
 app.innerHTML=`<div class="top"><button class="x" id="x" aria-label="Stoppen">✕</button><div class="bar"><i style="width:${pct}%"></i></div><div class="streak">${G.streak>1?'🔥'+G.streak:''}</div></div>
 <div class="card" style="--col:${COL[t]}">${body}${G.mode==='typ'?'<div class="display" id="disp">&nbsp;</div>':''}</div>
 ${useOpts?`<div class="opts">${options(t*n,t,n).map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join('')}</div>`
 :`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-d="${d}">${d}</button>`).join('')}<button class="key" data-d="del">⌫</button><button class="key" data-d="0">0</button><button class="key go" data-d="ok">✓</button></div>`}
 <div class="fb" id="fb"></div>${n>1?'<button class="hint" id="hint">💡 Hulp</button>':''}`;
 $('#x').onclick=home;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.v,b));
 app.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.d));
 const h=$('#hint'); if(h)h.onclick=()=>{const a=[];for(let k=1;k<n;k++)a.push(t*k);$('#fb').innerHTML=`${a.join(', ')}, …`;h.remove()};
}
function press(d){ if(G.locked)return; const disp=$('#disp'); if(!disp)return;
 if(d==='del')G.typed=G.typed.slice(0,-1); else if(d==='ok'){ if(G.typed)answer(+G.typed); return }
 else if(G.typed.length<3)G.typed+=d;
 disp.textContent=G.typed||'\u00a0'; }
document.addEventListener('keydown',e=>{ if(!G||G.mode!=='typ')return; if(/^\d$/.test(e.key))press(e.key); else if(e.key==='Backspace')press('del'); else if(e.key==='Enter')press('ok'); });

function answer(v,btn){ if(G.locked)return; G.locked=true; const q=G.qs[G.i],ans=q.t*q.n,key=q.t+'x'+q.n,ok=v===ans,fb=$('#fb');
 if(ok){ if(!q.retry){G.score++;save[key]=(save[key]||0)+1;store()} G.streak++; beep([523,659,784]);
  if(btn)btn.classList.add('good'); else $('#disp').style.background='var(--green)';
  fb.innerHTML=PRAISE[rnd(PRAISE.length)]+' ⭐'; if(G.streak%5===0)confetti(18);
  setTimeout(next,G.mode==='reeks'?1100:950);
 } else { G.streak=0; beep([300,220]); save[key]=Math.max(0,(save[key]||0)-1);store();
  if(!q.retry)G.qs.push({...q,retry:true});
  if(btn){btn.classList.add('bad','shake'); app.querySelectorAll('.opt').forEach(b=>{if(+b.dataset.v===ans)b.classList.add('good')})}
  else {$('#disp').style.background='var(--red)'}
  fb.innerHTML=`Bijna! Het antwoord is<div class="sum">${q.t} × ${q.n} = ${ans}</div><button class="btn" id="nx">Verder</button>`;
  $('#nx').onclick=next; const h=$('#hint'); if(h)h.remove(); }
}
function next(){ G.i++; G.i>=G.qs.length?finish():ask(); }
function finish(){ const s=G.score,st=s>=9?3:s>=7?2:s>=5?1:0, mode=G.mode;
 const msg=st===3?'Fantastisch! Je bent een tafelkampioen!':st===2?'Heel knap gedaan!':st===1?'Goed bezig, blijf oefenen!':'Oefening baart kunst. Probeer het nog eens!';
 app.innerHTML=`<div class="result"><div class="mascot">${st?'🐙':'🐙'}</div><div class="big">${'⭐'.repeat(st)||'💪'}</div>
 <p>${s} van de 10 meteen goed</p><p>${msg}</p>
 <button class="btn" id="again">Nog een keer</button><button class="btn" id="home" style="background:#fff">Menu</button></div>`;
 $('#again').onclick=()=>start(mode); $('#home').onclick=home; if(st)confetti(40); beep(st?[523,659,784,1047]:[392,330]); }

home();
</script>
</body>
</html>
